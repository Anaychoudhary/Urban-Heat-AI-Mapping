spring.application.name=UrbanHeat
# ===============================
# POSTGRESQL DATABASE CONNECTION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/urbanheat
spring.datasource.username=postgres

# REPLACE THIS with the password you created during installation!
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HIBERNATE & JPA SETTINGS
# ===============================
# "update" tells Spring to automatically create or update your tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries in your console so you can see the tables being created
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate which database dialect to use
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect